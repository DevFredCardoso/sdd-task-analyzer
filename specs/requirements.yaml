# Resumo do contrato do SDD (seção 1.3). Documentação apenas: não é lido pelo código.
modulo: TaskAnalyzer
python_minimo: "3.11"
dependencias_autorizadas: [biblioteca padrão, pytest]
entrada:
  tarefa: [id_tarefa, titulo, prioridade, data_criacao, data_inicio, data_conclusao, prazo, status]
